name: Site

# Builds the documentation site (`site/`, Next.js + Nextra static export) and
# publishes `site/out` to GitHub Pages, served at https://pwfabric.com.
#
# Based on GitHub's starter workflow pages/nextjs.yml, with one deliberate
# difference: configure-pages is NOT given `static_site_generator: next`, so it
# does not inject a basePath. The site lives at the root of its custom domain,
# and `site/public/CNAME` keeps that domain attached across deployments.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a queued run waits instead of cancelling a
# deployment that is already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build the site
        run: pnpm --filter pwfabric-site build

      - name: Every sitemap URL has a page
        run: pnpm --filter pwfabric-site check:sitemap

      - name: The custom domain ships with the build
        run: test "$(cat site/out/CNAME)" = "pwfabric.com"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
